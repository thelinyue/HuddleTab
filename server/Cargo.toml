[package]
name = "huddletab-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "huddletab_server"
path = "src/lib.rs"

[[bin]]
name = "huddletab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
headers = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "time"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
unicode-normalization = "0.1"
utoipa = { version = "5.4", features = ["uuid"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1.7"
tempfile = "3.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
