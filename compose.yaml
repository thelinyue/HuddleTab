services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huddletab}
      POSTGRES_USER: ${POSTGRES_USER:-huddletab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huddletab}
    volumes:
      - ${DATA_HOST_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/thelinyue/huddletab:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-huddletab}:${POSTGRES_PASSWORD:-huddletab}@postgres:5432/${POSTGRES_DB:-huddletab}
      DATA_DIR: /data
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5660}
      APP_VERSION: ${APP_VERSION:-dev}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RUST_LOG: ${RUST_LOG:-huddletab_server=info}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-5660}:5660"
    volumes:
      - ${DATA_HOST_DIR:-./data}/app:/data
    healthcheck:
      test: ["CMD-SHELL", "exec gosu \"$$PUID:$$PGID\" curl --fail --silent http://127.0.0.1:5660/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
